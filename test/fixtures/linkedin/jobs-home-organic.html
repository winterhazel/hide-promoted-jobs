<!DOCTYPE html>
<html
  lang="en"
  data-fixture-sanitized="true"
  data-fixture-view="jobs-home"
  data-fixture-path="/jobs/"
  data-fixture-layout="sdui"
>
  <body>
    <section data-fixture-list="top-applicant">
      <div data-fixture-card="job">
        <div data-fixture-card-content>
          <div data-display-contents>
            <a
              href="/jobs/collections/top-applicant/?currentJobId=1002"
              data-fixture-job-link
            >
              <div>
                <p>Example Role B</p>
                <p>Example Company</p>
                <p>Posted 2 days ago</p>
              </div>
            </a>
          </div>
        </div>
        <div data-fixture-card-action>
          <button aria-label="Dismiss Example Role B job"></button>
        </div>
      </div>
    </section>
  </body>
</html>
